<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра "Средиземье"</title>
    <link rel="stylesheet" href="./src/assets/styles.css">
</head>
<body>
    <h1>Игра "Средиземье"</h1>

    <div class="player-setup">
        <label for="faction1">Фракция 1 (Люди/Эльфы/Колдуны):</label>
        <input type="number" id="faction1" min="0">
        <label for="faction2">Фракция 2 (Орки/Колдуны):</label>
        <input type="number" id="faction2" min="0">
        <button id="start-button">Начать битву</button>
    </div>
    <div id="battle-log">
        <!-- Здесь будет выводиться лог битвы -->
    </div>
    <div id="winner">
        <!-- Здесь будет отображаться победитель -->
    </div>
    <script type="module" src="./src/js/script.js"></script>
</body>
</html>
